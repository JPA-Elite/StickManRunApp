name: flutter_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Notes persistence + settings
  shared_preferences: ^2.3.2

  # Rich text editing (needs to be compatible with current Flutter TextInputClient API)
  flutter_quill: ^11.5.1

  # Attachments (pick files, open them)
  file_picker: ^8.1.6
  open_filex: ^4.4.0

  # Export/share notes backup
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  # Local notifications (Reminders)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_native_timezone: ^2.0.0

  # Helpers
  intl: ^0.20.2

  # Biometric auth (unlock locked notes)
  local_auth: ^2.3.0

  # Voice-to-notes (speech recognition)
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

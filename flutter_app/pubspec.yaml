name: flutter_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Notes persistence + settings
  shared_preferences: ^2.3.2

  # Rich text editing
  flutter_quill: ^9.1.2

  # Attachments (pick files, open them)
  file_picker: ^8.1.6
  open_filex: ^4.4.0

  # Export/share notes backup
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  # Helpers
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
